<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Reel</title>
        <style>
            :root {
                color-scheme: dark;
                --bg: #16130f;
                --card: #1f1b16;
                --text: #f3ede4;
                --muted: #a59b8c;
                --amber: #e6b65c;
                --danger: #f08a7a;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                background: var(--bg);
                color: var(--text);
                font: 18px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            }
            main {
                width: min(640px, 100% - 48px);
                background: var(--card);
                border: 1px solid #2d2820;
                border-radius: 20px;
                padding: 40px;
            }
            .logo {
                display: flex;
                align-items: center;
                gap: 12px;
                font-size: 28px;
                font-weight: 700;
            }
            .logo span {
                display: inline-grid;
                place-items: center;
                width: 44px;
                height: 44px;
                border-radius: 12px;
                background: #2a241b;
                color: var(--amber);
                font-size: 26px;
            }
            p {
                color: var(--muted);
            }
            label {
                display: block;
                margin: 24px 0 8px;
                font-weight: 600;
            }
            input {
                width: 100%;
                padding: 14px 16px;
                border-radius: 12px;
                border: 2px solid #3a3328;
                background: #120f0c;
                color: var(--text);
                font: inherit;
            }
            input:focus,
            button:focus {
                outline: 3px solid var(--amber);
                outline-offset: 3px;
            }
            button {
                margin-top: 24px;
                width: 100%;
                padding: 14px;
                border: 0;
                border-radius: 12px;
                background: var(--amber);
                color: #1a1408;
                font: inherit;
                font-weight: 700;
            }
            button[disabled] {
                opacity: 0.6;
            }
            .error {
                min-height: 1.5em;
                margin: 12px 0 0;
                color: var(--danger);
            }
        </style>
    </head>
    <body>
        <main>
            <div class="logo"><span>◉</span> Reel</div>
            <p>
                Enter your TMDB API key to get started. You can get one for free at <strong>themoviedb.org/settings/api</strong> (an account is
                needed). It's stored only on this TV.
            </p>
            <form id="form">
                <label for="key">TMDB API key</label>
                <input id="key" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="API key (v3) or read access token" autofocus />
                <div class="error" id="error" role="alert"></div>
                <button id="save" type="submit">Start watching</button>
            </form>
        </main>
        <script>
            const form = document.getElementById("form")
            const input = document.getElementById("key")
            const error = document.getElementById("error")
            const save = document.getElementById("save")
            input.focus()
            // D-pad: down from the field goes to the button, up goes back
            document.addEventListener("keydown", (e) => {
                if (e.key === "ArrowDown" && document.activeElement === input) save.focus()
                if (e.key === "ArrowUp" && document.activeElement === save) input.focus()
            })
            form.addEventListener("submit", async (e) => {
                e.preventDefault()
                error.textContent = ""
                save.disabled = true
                save.textContent = "Checking…"
                try {
                    const r = await fetch("/__reel/setup", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ tmdbApiKey: input.value }),
                    })
                    const body = await r.json()
                    if (!r.ok) throw new Error(body.error || "Something went wrong")
                    save.textContent = "Starting…"
                    for (let i = 0; i < 60; i++) {
                        const h = await fetch("/__reel/health").then((x) => x.json())
                        if (h.core === "ready") return location.replace("/")
                        if (h.core === "error") throw new Error("Reel couldn't start its streaming service.")
                        await new Promise((r) => setTimeout(r, 500))
                    }
                    location.replace("/")
                } catch (err) {
                    error.textContent = err.message
                    save.disabled = false
                    save.textContent = "Start watching"
                    input.focus()
                }
            })
        </script>
    </body>
</html>
