<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
        <title>Reel</title>
        <style>
            :root { color-scheme: dark; }
            body { margin: 0; height: 100vh; display: grid; place-items: center; background: #16130f; color: #eee; font: 15px/1.5 -apple-system, system-ui, sans-serif; }
            .card { width: min(440px, 90vw); padding: 32px; border-radius: 16px; background: #211b15; box-shadow: 0 10px 40px #0006; }
            h1 { margin: 0 0 4px; font-size: 22px; }
            p { color: #aaa; margin: 0 0 20px; }
            a { color: #8ab4ff; }
            input { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 8px; border: 1px solid #444; background: #1b1b1b; color: #eee; font: inherit; }
            button { margin-top: 14px; width: 100%; padding: 10px; border: 0; border-radius: 8px; background: #e8b65a; color: #1a140d; font: inherit; font-weight: 600; cursor: pointer; }
            .err { color: #ff8a8a; margin-top: 10px; min-height: 1.5em; white-space: pre-wrap; }
            .spin { width: 28px; height: 28px; border: 3px solid #555; border-top-color: #eee; border-radius: 50%; animation: s 0.8s linear infinite; margin: 0 auto 14px; }
            @keyframes s { to { transform: rotate(360deg); } }
            [hidden] { display: none !important; }
        </style>
    </head>
    <body>
        <div class="card" id="setup" hidden>
            <h1>Welcome to Reel</h1>
            <p>Enter your TMDB API key (v3) to get started. Get one for free at <a href="https://www.themoviedb.org/settings/api" target="_blank">themoviedb.org</a>.</p>
            <form id="form">
                <input id="key" placeholder="TMDB API key" autocomplete="off" spellcheck="false" autofocus />
                <button type="submit">Start Reel</button>
                <div class="err" id="err"></div>
            </form>
        </div>
        <div class="card" id="loading" hidden style="text-align: center">
            <div class="spin"></div>
            <p style="margin: 0">Starting Reel…</p>
        </div>
        <div class="card" id="error" hidden>
            <h1>Couldn't start Reel</h1>
            <div class="err" id="errmsg"></div>
            <button id="reset">Re-enter API key and restart</button>
        </div>
        <script>
            const q = new URLSearchParams(location.search)
            const mode = q.get("mode") || "setup"
            document.getElementById(mode).hidden = false
            if (mode === "error") document.getElementById("errmsg").textContent = q.get("msg") || "Unknown error"
            document.getElementById("reset").onclick = () => window.cineproDesktop.reset()
            document.getElementById("form").onsubmit = async (e) => {
                e.preventDefault()
                const res = await window.cineproDesktop.saveSetup(document.getElementById("key").value)
                if (!res.ok) document.getElementById("err").textContent = res.error
            }
        </script>
    </body>
</html>
